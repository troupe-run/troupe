name: Bug
description: troupe does something it shouldn't, or doesn't do what its specs say.
type: Bug
body:
  - type: textarea
    id: happened
    attributes:
      label: What happened
      description: Include the exact command, output and exit code.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: Link the spec requirement if you know it.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The smallest theatre and commands that show it.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and platform
      description: Output of `troupe --version`, and your OS.
