name: Feature
description: Something troupe should do. Becomes one OpenSpec change.
type: Feature
body:
  - type: markdown
    attributes:
      value: |
        Describe the outcome, not the implementation. The OpenSpec change holds the design and tasks.
        Add a `cap:<capability>` label for each capability this touches.
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: Who needs what, and why.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: In and out of scope
  - type: input
    id: change
    attributes:
      label: OpenSpec change
      description: The change name under openspec/changes/, once it exists.
