# Source: troupe-run/infrastructure. Change it there; copies in other repositories are delivered.
name: guard

# The git-level workflow rules, re-checked on GitHub (troupe-run/infrastructure:
# docs/development-workflow.md): every commit is a Conventional Commit, the branch matches an
# OpenSpec change, no archived change has an unticked task, delivered files change only by
# delivery, and the specs and active changes in scope pass OpenSpec's strict validation
# (`openspec-strict`: what a pull request touches, everything on main), and, in troupe, the specs in
# that scope name capability labels troupe-run/infrastructure declares on main (`capability-label`,
# read from GitHub with the run's token). A pull request's title is checked as a commit message
# too, and its description must close an issue (`pr-closes-issue`; release-please's is exempt), so
# `edited` re-runs it when either changes. Local hooks can be skipped; this can't: it's a required
# check (tofu/required-checks.json).
#
# A merge queue's commit is judged as a push to main (merge-queue design D3): its range runs from
# the group's base on main, and every pull request in it already passed the branch rule. The
# queue's own gh-readonly-queue/... branch matches no change, so a push to it isn't judged here.
on:
  push:
    branches: ["**", "!gh-readonly-queue/**"]
  pull_request:
    types: [opened, edited, synchronize, reopened]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: guard-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: guard (workflow rules)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # The OpenSpec CLI openspec-strict runs: one exact version, moved by pull request. Before a
      # move is delivered, run it over every governed repository's main (docs/development-workflow.md).
      OPENSPEC_VERSION: 1.14.3
      # The Node the OpenSpec CLI runs on where the repository has no .nvmrc of its own. One exact
      # version, moved by pull request. A repository's .nvmrc wins, so its single source holds, and
      # no step names a Node version as an input (troupe-run/website#4 refuses one; #155).
      NODE_VERSION: 22.23.4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every commit and branch, to compute the range. For a pull request, its head commit,
          # not GitHub's synthetic merge commit (whose "Merge ..." message isn't the author's).
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Choose the Node version
        # Written only into this run's checkout, never committed; the guard reads no untracked file.
        run: |
          if [ -e .nvmrc ]; then
            echo "Node from the repository's .nvmrc: $(cat .nvmrc)"
          else
            printf '%s\n' "$NODE_VERSION" > .nvmrc
            echo "No .nvmrc here, so Node $NODE_VERSION, the guard's pin"
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install the OpenSpec CLI
        env:
          OPENSPEC_TELEMETRY: "0"
          DO_NOT_TRACK: "1"
        run: npm install --global --no-fund --no-audit "@fission-ai/openspec@${OPENSPEC_VERSION}"
      - name: Check the workflow rules
        env:
          # capability-label reads troupe-run/infrastructure's declared labels, a public file, with it.
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run --no-project python scripts/guard.py ci
