# Source: troupe-run/infrastructure. Change it there; copies in other repositories are delivered.
name: mutation-pr

# Mutation tests what a ready pull request changed, and reports the mutants that survive on its
# changed lines (spec: mutation-testing; #325; lint-mutation design D9). It's a report: never a
# required check, and it succeeds when it finds survivors. Only its own failure to run fails it.
# Its comment and summary give its runtime, so the owner can decide later whether it should block.
#
#   mutate   contents read, no secret   runs the pull request's code under mutation, within
#                                       pr_budget_minutes (scripts/mutation.json), and hands on
#                                       only its report
#   comment  pull-requests write        checks out the base commit only, reads the report as data,
#                                       and keeps one comment on the pull request
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

# A newer push replaces the run for the older one.
concurrency:
  group: mutation-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Only the repositories scripts/mutation.json lists get mutation testing (#332). infrastructure
  # holds this workflow as its source without being listed, so its own pull requests stop here.
  listed:
    name: is this repository mutation tested?
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      listed: ${{ steps.listed.outputs.listed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: scripts/mutation.json
          sparse-checkout-cone-mode: false
      - name: Read the list
        id: listed
        run: |
          set -euo pipefail
          name=${GITHUB_REPOSITORY#*/}
          if jq -e --arg name "$name" '.repositories | has($name)' scripts/mutation.json >/dev/null; then
            echo "listed=true" >> "$GITHUB_OUTPUT"
          else
            echo "$name isn't in scripts/mutation.json's repositories: its pull requests aren't mutation tested."
            echo "listed=false" >> "$GITHUB_OUTPUT"
          fi

  mutate:
    name: mutate the changes
    needs: listed
    # A draft runs nothing, like CI; marking it ready runs it.
    if: ${{ !github.event.pull_request.draft && needs.listed.outputs.listed == 'true' }}
    runs-on: ubuntu-latest
    # pr_budget_minutes (scripts/mutation.json) plus 30 for setup and the report; a test holds the
    # two together.
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      # The merge with the base, as the pull request would merge: a branch made before a delivery
      # lacks scripts/mutation.json and the scripts this job runs, which its merge has (#332).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.15"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ hashFiles('package-lock.json') != '' }}
        with:
          node-version-file: .nvmrc
      # infrastructure's tests run tofu and, in GitHub Actions, tflint (its check's gates), at the versions its
      # CI uses; a test holds tflint's to .tflint.hcl.
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        if: ${{ hashFiles('tofu/versions.tf') != '' }}
        with:
          tofu_version: 1.13.1
          tofu_wrapper: false
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        if: ${{ hashFiles('.tflint.hcl') != '' }}
        with:
          tflint_version: v0.66.0
          tflint_wrapper: false
      - name: Install the repository and the tool
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then
            npm ci
          else
            uv sync --locked
            uv pip install "mutmut==$(jq -r '.tools.mutmut' scripts/mutation.json)"
          fi
      - name: Mutate what changed
        env:
          MERGE: ${{ github.sha }}
          RESOURCES: ${{ github.workspace }}/out/resources-pr.log
        # Against the merge's first parent, the base it merged onto, so only the pull request's own
        # changes are mutated, at their lines in the merge.
        run: |
          set -euo pipefail
          # resources: begin
          # The runner's memory, swap, disk and load once a minute while mutmut runs, to the log and to a
          # file uploaded with the report, so a lost runner leaves what it last saw (#337; design D1).
          mkdir -p "$(dirname "$RESOURCES")"
          sample_resources() {
            local meminfo=${RESOURCES_MEMINFO:-/proc/meminfo} loadavg=${RESOURCES_LOADAVG:-/proc/loadavg} line
            while :; do
              line="$(date -u +%H:%M:%S)"
              line+=" mem_available_mb=$(awk '/^MemAvailable:/ {print int($2 / 1024)}' "$meminfo")"
              line+=" swap_free_mb=$(awk '/^SwapFree:/ {print int($2 / 1024)}' "$meminfo")"
              line+=" disk_free_mb=$(df -Pm . | awk 'NR == 2 {print $4}')"
              line+=" load1=$(cut -d' ' -f1 "$loadavg")"
              # mutmut's children are titled "mutmut: <mutant>": these are the mutants running at once.
              line+=" mutmut_processes=$( (pgrep -f '^mutmut: ' || true) | wc -l | tr -d ' ')"
              echo "resources: $line"
              echo "$line" >> "$RESOURCES"
              sleep "${RESOURCES_SECONDS:-60}"
            done
          }
          lowest_resources() {
            kill "$sampler" 2>/dev/null || true
            wait "$sampler" 2>/dev/null || true
            local lowest
            lowest=$(awk '{split($2, f, "="); if (min == "" || f[2] + 0 < min + 0) {min = f[2]; at = $1}}
              END {if (min != "") print min " at " at}' "$RESOURCES" 2>/dev/null || true)
            if [[ -n "$lowest" ]]; then
              echo "resources: lowest mem_available_mb=$lowest"
              echo "Mutation run: lowest free memory: ${lowest/ at / MB at } UTC" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            fi
          }
          sample_resources &
          sampler=$!
          trap lowest_resources EXIT
          # resources: end
          BASE=$(git rev-parse "$MERGE^1")
          HEAD=$MERGE
          mkdir -p out
          # containment: begin
          # The mutation runs in a PID namespace, a session and a cgroup of its own, as the runner's user with the
          # step's environment: a mutant that signals every process (kill -1) or its own group (kill 0), or a run
          # that exhausts memory, ends at most the run, never the runner agent (#345; probe
          # troupe-run/infra-probe-runner-killall). sudo resets the environment, so it's saved and restored
          # inside; systemd-run doesn't expand $ in the command; setsid gives the run its own process group,
          # which a PID namespace alone doesn't.
          run_contained() {
            local memory=${MUTATION_MEMORY_MAX:-12G} tasks=${MUTATION_TASKS_MAX:-8192}
            local unit="mutation-${GITHUB_RUN_ID:-local}-${GITHUB_JOB:-job}-$RANDOM" since saved status=0
            since=$(date '+%Y-%m-%d %H:%M:%S')
            saved=$(mktemp)
            export -p > "$saved"
            sudo systemd-run --scope --quiet --expand-environment=no --unit="$unit" \
                -p MemoryMax="$memory" -p MemorySwapMax=0 -p TasksMax="$tasks" \
              unshare --pid --fork --mount-proc --kill-child \
              setsid --wait \
              setpriv --reuid="$(id -u)" --regid="$(id -g)" --init-groups -- \
              bash -c 'source "$1"; shift; exec "$@"' restore "$saved" "$@" || status=$?
            rm -f "$saved"
            if (( status != 0 )); then
              if sudo journalctl -k --since "$since" --no-pager 2>/dev/null | grep -F "$unit" | grep -qi "oom"; then
                echo "::error::the mutation run ran out of memory (MemoryMax $memory)"
              elif (( status > 128 )); then
                echo "::error::the mutation run was killed by signal $((status - 128))"
              else
                echo "::error::the mutation run exited with status $status"
              fi
            fi
            return "$status"
          }
          # containment: end
          if [[ -f package-lock.json ]]; then
            run_contained python3 scripts/mutation_pr.py run "$BASE" "$HEAD" out/pr-report.json
          else
            run_contained uv run --no-sync python scripts/mutation_pr.py run "$BASE" "$HEAD" out/pr-report.json
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-report
          path: out/pr-report.json
          retention-days: 90
      # The readings, kept when the run fails too (#337).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: resources
          path: out/resources-pr.log
          if-no-files-found: ignore
          retention-days: 90

  comment:
    name: report on the pull request
    needs: mutate
    # Not on a fork's pull request, whose token can't comment.
    if: ${{ needs.mutate.result == 'success' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      # The base commit only: never the pull request's own code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pr-report
          path: out
      - name: Keep one comment on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          python3 scripts/mutation_pr.py comment out/pr-report.json > "$RUNNER_TEMP/comment.md"
          marker=$(head -n1 "$RUNNER_TEMP/comment.md")
          existing=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n1)
          if [[ -n "$existing" ]]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -F "body=@$RUNNER_TEMP/comment.md" > /dev/null
          elif [[ "$(jq -r '.nothing' out/pr-report.json)" == true ]]; then
            # Nothing was mutated and nothing was said before: no comment (spec: "No source changed").
            echo "No file this repository mutation tests changed: no comment."
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments" -F "body=@$RUNNER_TEMP/comment.md" > /dev/null
          fi
