schema: spec-driven

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish
context: |
  troupe runs a software process with agents and people in named roles. It is local-first: config, history and
  decisions live in the project's git repo. Pre-alpha; built in stages, and requirements will change. Build for the
  current stage in a way that is easy to change.

  Fixed constraints:
  - Python 3.12+, managed with uv. Linux, macOS and Windows, all supported from the first commit and required in CI.
    Keep OS-specific behaviour (paths, file locking, atomic replace, processes and signals, daemon IPC, file
    watching) behind one named seam, and choose mechanisms that work on all three rather than adapting later.
  - Pure event sourcing and CQRS, configuration included. Events come first; files are projections.
  - troupe's own state is text that git can merge (append-only, line-per-record). No SQLite or binary stores.
  - Every event carries lineage: actor (human, agent, or explicit unknown, never null), via, time, reason, change id
    (the correlation ID that one command's events share, and that events recorded in reaction to them inherit), cause
    (the command, or the event it was recorded in reaction to), approvals. Fail when there is no identity.
  - Stages (sandboxes), actor runners, notification channels and guests are pluggable. Declared effects are enforced
    on code that runs over JSON-RPC.
  - Humans hold roles like agents. Gates and escalations name the role they route to, never "the human".
  - One repo until 1.0: packages/ (core and its bundled adapters, run direct), plugins/ (JSON-RPC plugins, ours
    included), protocol/ (language-neutral). Plugins stay self-contained so they can be split into their own repos
    later. The site and other deliverables live in their own repos.
  - Every port is defined in core, with a direct (in-process) and a JSON-RPC transport. Core, the adapters bundled
    with it and the libraries it pins run direct. Plugins, ours included, and anything acquired by config run over
    JSON-RPC. In-process code is trusted and its effects aren't enforced; policy can restrict which transports are
    allowed. Neither transport is a sandbox: stages and policy decide what code can touch.
  - Version control, storage and identity sources are adapters: git is one VCS adapter, a plain filesystem another.
  - Every limit (timeouts, sizes, costs, endpoints) is a named setting with its default in one place. Policy is
    authoritative: a lower level can tighten it, never loosen it.
  - Nothing may rule out a hosted, multi-tenant deployment: address theatres by id rather than host path, and take
    identity from a provider rather than the OS directly.

  The first people who use it will be developers who review their files as diffs, but later (pre 1.0) there will be a
  UI which enables generic workflows for non-technical users. It is expected this workflow will be a local run server
  connecting to the same internal workflow as the CLI and dev-friendly tooling uses.
  - The CLI is a thin client. Commands and queries live in a core that the CLI, the run server and later UIs all
    call; no behaviour exists only in one surface.
  - Never reformat, reorder or rewrite anything the user did not ask to change, whichever surface made the change.
    A UI edit to config is a set like any other, written back surgically.
  - Refuse rather than guess. Messages name the problem, the path and the fix, and are structured data so each
    surface can phrase them for its own users.
  - A malformed or ambiguous input is an error that names the input and the fix, never a quiet fall-through to a
    default. Only an absent input may fall through.
  - Never wait silently or indefinitely.

  Quality bar:
  - Fully typed; mypy --strict and ruff clean, checked in the pipeline.
  - Every behaviour has a test that fails when it breaks; a test's name states exactly what its body checks. Test real
    shapes, and use property or fuzz tests for unusual inputs.
  - Done means verified: run the tests and show the result.
  - Keep each decision in one named place. When unsure, take the choice that cannot lose user data, and say so.
  - Deliver the whole of what is asked; never quietly narrow scope.

  Working:
  - Don't invent requirements. Before asking, research what you can reach; then ask with findings, options and a
    recommendation.
  - Surface design decisions in the proposal or design before code depends on them.
  - Keep specs, code and tests in agreement; change all three together.
  - When a change fixes a tracked issue, comment on the issue with the change and close it.
  - Commit in small steps with messages that say why.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
