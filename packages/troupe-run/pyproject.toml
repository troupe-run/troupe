[project]
name = "troupe-run"
version = "0.1.0"
description = "troupe, with the adapters and runners it bundles: what you install to run troupe."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.16"
# Every other workspace member, by name: bare until its first release, then pinned at its latest release tag by the
# release workflow's pinning pull request (release-each-package design D2, D4). Installing a commit installs each one
# from that commit, since the root's workspace sources win (install-with-uv design D1); installing a troupe-run tag
# with --no-sources installs each from its pin (design D3). scripts/bundle.py fails the check when one is missing.
dependencies = [
    "troupe @ git+https://github.com/troupe-run/troupe@troupe-v0.1.0#subdirectory=packages/troupe",
    "troupe-artifacts-local @ git+https://github.com/troupe-run/troupe@troupe-artifacts-local-v0.1.0#subdirectory=packages/troupe-artifacts-local",
    "troupe-identity-local @ git+https://github.com/troupe-run/troupe@troupe-identity-local-v0.1.0#subdirectory=packages/troupe-identity-local",
    "troupe-plugin-sdk",
    "troupe-stage-local @ git+https://github.com/troupe-run/troupe@troupe-stage-local-v0.1.0#subdirectory=packages/troupe-stage-local",
    "troupe-store-text @ git+https://github.com/troupe-run/troupe@troupe-store-text-v0.1.0#subdirectory=packages/troupe-store-text",
    "troupe-vcs-files @ git+https://github.com/troupe-run/troupe@troupe-vcs-files-v0.1.0#subdirectory=packages/troupe-vcs-files",
    "troupe-vcs-git @ git+https://github.com/troupe-run/troupe@troupe-vcs-git-v0.1.0#subdirectory=packages/troupe-vcs-git",
    "troupe-runner-claude-code @ git+https://github.com/troupe-run/troupe@troupe-runner-claude-code-v0.1.0#subdirectory=plugins/runner-claude-code",
    "troupe-runner-ollama",
    "troupe-runner-openai",
    "troupe-runner-scripted @ git+https://github.com/troupe-run/troupe@troupe-runner-scripted-v0.1.0#subdirectory=plugins/runner-scripted",
]

# A runner plugin that depends on anything beyond the plugin SDK is an extra named exactly after its
# runner, and in 'all'; one that depends only on the SDK stays in the dependencies above. Each entry
# is bare or pinned like a dependency, and 'all' repeats each one exactly. scripts/bundle.py fails
# the check otherwise (runner-extras design D2, D4; owner, #333).
[project.optional-dependencies]
all = [
    "troupe-runner-lm-studio",
]
lm-studio = [
    "troupe-runner-lm-studio",
]

[project.urls]
Homepage = "https://troupe.run"
Repository = "https://github.com/troupe-run/troupe"

# uv tool links only this package's own commands, so it declares core's (install-with-uv design D2).
[project.scripts]
troupe = "troupe.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"
