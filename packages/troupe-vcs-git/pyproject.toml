[project]
name = "troupe-vcs-git"
version = "0.0.1.dev0"
description = "troupe's git adapter: branch, HEAD, what is committed and the configured identity, read through git."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.16"
dependencies = ["troupe"]

[project.urls]
Homepage = "https://troupe.run"
Repository = "https://github.com/troupe-run/troupe"

# Found by name through the entry point group (design D1); troupe never imports this package directly.
[project.entry-points."troupe.vcs"]
git = "troupe_vcs_git:GitAdapter"

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"
