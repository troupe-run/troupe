[project]
name = "troupe"
version = "0.0.1.dev0"
description = "Run your development process with a team of agents, asking only when it needs you."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.16"
dependencies = [
    "eventsourcing>=9.5.6,<9.6",
    # Checks an actor's options against its runner's published options schema, which core can't generate types for
    # (config-model design D6).
    "jsonschema>=4.26,<5",
    # Config's types, generated from protocol/schemas/config/ (config-model design D11).
    "pydantic>=2.14,<3",
    # Writes config files. Pinned to a minor version: an upgrade that renders differently changes files' hashes
    # (config-model design D8).
    "ruamel.yaml>=0.19.1,<0.20",
]

[project.urls]
Homepage = "https://troupe.run"
Repository = "https://github.com/troupe-run/troupe"

[project.scripts]
troupe = "troupe.cli:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"
