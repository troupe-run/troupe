[project]
name = "troupe-runner-ollama"
version = "0.0.0"
description = "An actor runner for troupe that drives a model served by Ollama, with troupe's own tool loop."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.16"
# The plugin SDK only, for the runner contract's types and the tools (spec: plugin-sdk, ollama-runner). A plugin
# imports nothing else of troupe's; it speaks the runner contract, and talks to Ollama with the standard library
# (local-model-runner design D2). Bare, like an adapter's dependency on troupe: the bundle pins it (runner-sdk D12).
dependencies = ["troupe-plugin-sdk"]

[project.urls]
Homepage = "https://troupe.run"
Repository = "https://github.com/troupe-run/troupe"

[project.scripts]
troupe-runner-ollama = "troupe_runner_ollama.runner:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"
