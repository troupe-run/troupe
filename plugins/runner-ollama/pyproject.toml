[project]
name = "troupe-runner-ollama"
version = "0.2.0"
description = "An actor runner for troupe that drives a model served by Ollama, through httpx2, with troupe's own tool loop."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.16"
# The plugin SDK, for the runner contract's types and the tools (spec: plugin-sdk, ollama-runner), and httpx2 with its
# transport layer httpcore2, pinned, which carry each request to Ollama (decision #319; #332; ollama-library design
# D1, D2). httpx2 rather than the ollama package, whose API can't send what the spec needs, and rather than httpx, so
# the runners share the anthropic runner's HTTP stack. A plugin imports nothing else of troupe's. The SDK is bare,
# like an adapter's dependency on troupe: the bundle pins it (runner-sdk D12). With these, this runner is troupe-run's
# ollama extra, not part of the base install (runner-extras design D1, D2).
dependencies = ["troupe-plugin-sdk", "httpx2==2.16.0", "httpcore2==2.16.0"]

[project.urls]
Homepage = "https://troupe.run"
Repository = "https://github.com/troupe-run/troupe"

[project.scripts]
troupe-runner-ollama = "troupe_runner_ollama.runner:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"
