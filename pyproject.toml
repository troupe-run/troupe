# Workspace root. Not a distributable package: it holds the workspace members, the shared dev toolchain and the
# tool configuration that scripts/check.py runs. See openspec/changes/bootstrap-repo/design.md (D1, D8).
[project]
name = "troupe-workspace"
version = "0"
requires-python = ">=3.12,<3.16"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "plugins/*"]

[tool.uv.sources]
troupe = { workspace = true }
troupe-artifacts-local = { workspace = true }
troupe-runner-claude-code = { workspace = true }
troupe-runner-scripted = { workspace = true }
troupe-run = { workspace = true }
troupe-stage-local = { workspace = true }
troupe-identity-local = { workspace = true }
troupe-store-text = { workspace = true }
troupe-vcs-files = { workspace = true }
troupe-vcs-git = { workspace = true }

[dependency-groups]
dev = [
    "troupe",
    "troupe-artifacts-local",
    "troupe-runner-claude-code",
    "troupe-runner-scripted",
    "troupe-run",
    "troupe-stage-local",
    "troupe-identity-local",
    "troupe-store-text",
    "troupe-vcs-files",
    "troupe-vcs-git",
    "ruff>=0.17.2",
    "mypy>=2.4",
    "pytest>=9.1",
    "hypothesis>=6.170.5",
    "import-linter>=2.15",
    "types-jsonschema>=4.26",
    # Generates troupe.core.config.models from the config schemas (scripts/generate_models.py).
    "datamodel-code-generator>=0.86,<0.87",
    # The eventsourcing recorder test suite imports AESCipher at module scope (design: prior art).
    "pycryptodome>=3.23",
    "pytest-xdist>=3.8",
    # scripts/tests/test_ci_workflow.py reads CI's triggers and job conditions (ci-on-merge-queue design D2).
    "pyyaml>=6.0.3",
    "types-pyyaml>=6.0.12",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# ruff format checks the Python blocks in Markdown, and no gate may read openspec/: CI skips the check for a change
# to it alone (scripts/check-paths.toml; ci-check-scope design D4).
extend-exclude = ["openspec"]
src = [
    "packages/troupe/src",
    "packages/troupe/tests",
    "packages/troupe-run/src",
    "packages/troupe-artifacts-local/src",
    "packages/troupe-artifacts-local/tests",
    "packages/troupe-identity-local/src",
    "packages/troupe-identity-local/tests",
    "packages/troupe-stage-local/src",
    "packages/troupe-stage-local/tests",
    "packages/troupe-store-text/src",
    "packages/troupe-store-text/tests",
    "packages/troupe-vcs-files/src",
    "packages/troupe-vcs-files/tests",
    "packages/troupe-vcs-git/src",
    "packages/troupe-vcs-git/tests",
    "plugins/runner-claude-code/src",
    "plugins/runner-claude-code/tests",
    "plugins/runner-scripted/src",
    "plugins/runner-scripted/tests",
    "scripts",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "PT", "N", "ANN", "S"]

[tool.ruff.lint.flake8-bugbear]
# Field factories for dataclasses that carry JSON metadata: they return dataclasses.field(...).
extend-immutable-calls = ["troupe.core.messages.json_field"]

[tool.ruff.lint.per-file-ignores]
# Tests assert, and drive the CLI and helper processes through subprocess with trusted arguments.
"packages/*/tests/**" = ["S101", "S603"]
"plugins/*/tests/**" = ["S101", "S603"]
# Plugin tools are owner-run scripts, like scripts/: they run fixed commands found on PATH.
"plugins/*/tools/**" = ["S603"]
"scripts/tests/**" = ["S101", "S603", "S607"]
# Repository scripts run the project's own tools (git, uv) from PATH with fixed arguments.
"scripts/**" = ["S603", "S607"]
# Generated from the config schemas (scripts/generate_models.py): docstrings are the schemas' descriptions, unwrapped.
"packages/troupe/src/troupe/core/config/models.py" = ["E501", "UP007"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
python_version = "3.12"
files = [
    "packages/troupe/src",
    "packages/troupe/tests",
    "packages/troupe-run/src",
    "packages/troupe-artifacts-local/src",
    "packages/troupe-artifacts-local/tests",
    "packages/troupe-identity-local/src",
    "packages/troupe-identity-local/tests",
    "packages/troupe-stage-local/src",
    "packages/troupe-stage-local/tests",
    "packages/troupe-store-text/src",
    "packages/troupe-store-text/tests",
    "packages/troupe-vcs-files/src",
    "packages/troupe-vcs-files/tests",
    "packages/troupe-vcs-git/src",
    "packages/troupe-vcs-git/tests",
    "plugins/runner-claude-code/src",
    "plugins/runner-claude-code/tests",
    "plugins/runner-scripted/src",
    "plugins/runner-scripted/tests",
    "scripts",
]
explicit_package_bases = true
mypy_path = [
    "packages/troupe/src",
    "packages/troupe/tests",
    "packages/troupe-run/src",
    "packages/troupe-artifacts-local/src",
    "packages/troupe-identity-local/src",
    "packages/troupe-stage-local/src",
    "packages/troupe-store-text/src",
    "packages/troupe-vcs-files/src",
    "packages/troupe-vcs-git/src",
    "plugins/runner-claude-code/src",
    "plugins/runner-claude-code/tests",
    "plugins/runner-scripted/src",
    "plugins/runner-scripted/tests",
    "scripts",
    "scripts/tests",
]

[tool.pytest.ini_options]
testpaths = [
    "packages/troupe/tests",
    "packages/troupe-artifacts-local/tests",
    "packages/troupe-identity-local/tests",
    "packages/troupe-stage-local/tests",
    "packages/troupe-store-text/tests",
    "packages/troupe-vcs-files/tests",
    "packages/troupe-vcs-git/tests",
    "plugins/runner-claude-code/tests",
    "plugins/runner-scripted/tests",
    "scripts/tests",
    # The scripts' tests that name packages' paths (the flake campaign's selection, the release configuration, the
    # members' Python bounds, the bundle and the install check), apart so only they run with those packages' scopes
    # (package-check-scopes design D6).
    "scripts/tests/workspace",
]
# Shared test helpers (theatres in real git repositories) live beside troupe's own tests.
pythonpath = ["packages/troupe/tests", "scripts"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "-p",
    "protocol_guard",
    "-p",
    "guard_pytest",
    "-p",
    "hypothesis_profiles",
]
xfail_strict = true
# A single test running this long has every thread's stack written to the output, so a stuck test
# names itself instead of only timing out the CI job (#187; windows-ci-hang design D1). The dump
# changes no outcome. 300 s is well above the slowest test (87 s on Windows) and leaves room before
# the job's 20-minute timeout after a 7.5 to 10 minute Windows suite. The flake hunt's rounds read
# it too unless given --stall.
faulthandler_timeout = 300

[tool.importlinter]
root_packages = [
    "troupe",
    "troupe_run",
    "troupe_artifacts_local",
    "troupe_identity_local",
    "troupe_stage_local",
    "troupe_store_text",
    "troupe_vcs_files",
    "troupe_vcs_git",
    "troupe_runner_claude_code",
    "troupe_runner_scripted",
]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "troupe layers: cli -> core -> platform"
type = "layers"
layers = ["troupe.cli", "troupe.core", "troupe.platform"]

[[tool.importlinter.contracts]]
name = "only troupe.platform imports OS-specific modules"
type = "forbidden"
source_modules = [
    "troupe",
    "troupe_artifacts_local",
    "troupe_identity_local",
    "troupe_stage_local",
    "troupe_store_text",
    "troupe_vcs_files",
    "troupe_vcs_git",
]
forbidden_modules = ["fcntl", "msvcrt", "termios", "signal", "winreg", "pwd", "grp", "ctypes"]
ignore_imports = ["troupe.platform.** -> *"]

[[tool.importlinter.contracts]]
# Stores are found by name through the troupe.artifacts entry point group, never imported (spec: artifact-store).
name = "troupe never imports a store package"
type = "forbidden"
source_modules = ["troupe"]
forbidden_modules = ["troupe_artifacts_local"]

[[tool.importlinter.contracts]]
# Plugins see troupe exactly as a third party would: they speak the protocol and import nothing of troupe's
# (plugins/README.md; bootstrap design D7.3).
name = "plugins import nothing from troupe"
type = "forbidden"
source_modules = ["troupe_runner_claude_code", "troupe_runner_scripted"]
forbidden_modules = ["troupe", "troupe_artifacts_local", "troupe_identity_local", "troupe_stage_local", "troupe_store_text", "troupe_vcs_files", "troupe_vcs_git"]

[[tool.importlinter.contracts]]
# The Claude Code runner can't use troupe.platform, so it keeps its own OS-specific behaviour (signals, Windows
# process calls) behind one named seam (claude-code-runner design D1).
name = "only the Claude Code runner's processes module imports OS-specific modules"
type = "forbidden"
source_modules = ["troupe_runner_claude_code"]
forbidden_modules = ["signal", "ctypes", "msvcrt", "_winapi", "fcntl", "termios", "winreg"]
ignore_imports = ["troupe_runner_claude_code.processes -> *"]

[[tool.importlinter.contracts]]
# Event-store adapters are found by name through the troupe.store, troupe.vcs and troupe.identity entry point
# groups, never imported, so every port is proven by a separately packaged implementation, and no surface can
# reach a recorder except through troupe.core.events (event-store design D1).
name = "troupe never imports an event-store adapter package"
type = "forbidden"
source_modules = ["troupe"]
forbidden_modules = ["troupe_identity_local", "troupe_store_text", "troupe_vcs_files", "troupe_vcs_git"]

[[tool.importlinter.contracts]]
# Adapters reach each other only through the ports in troupe.core (for example, the vcs identity source asks
# the VCS port, never the git adapter), and never import a surface (event-store design D1).
name = "event-store adapters are independent of each other"
type = "independence"
modules = ["troupe_identity_local", "troupe_store_text", "troupe_vcs_files", "troupe_vcs_git"]

[[tool.importlinter.contracts]]
name = "event-store adapters import no surface"
type = "forbidden"
source_modules = ["troupe_identity_local", "troupe_store_text", "troupe_vcs_files", "troupe_vcs_git"]
forbidden_modules = ["troupe.cli"]

[[tool.importlinter.contracts]]
# Stages are found by name through the troupe.stages entry point group, never imported, and the local stage reaches
# troupe only through the core's ports (spec: stages; perform-status-logs design D1).
name = "troupe never imports a stage package"
type = "forbidden"
source_modules = ["troupe"]
forbidden_modules = ["troupe_stage_local"]

[[tool.importlinter.contracts]]
name = "stage packages import no surface"
type = "forbidden"
source_modules = ["troupe_stage_local"]
forbidden_modules = ["troupe.cli"]

[[tool.importlinter.contracts]]
# The CLI reaches perform, status, logs, config-set, config-get and flush only through the client protocol's messages,
# so no behaviour exists in the CLI alone (spec: client-protocol; perform-status-logs design D1; config-model D1).
name = "the CLI reaches runs and config only through the client protocol"
type = "forbidden"
source_modules = ["troupe.cli"]
forbidden_modules = ["troupe.core.runs", "troupe.core.stages", "troupe.core.policy", "troupe.core.config"]
# troupe.core.client reaches them on the CLI's behalf; only a direct import bypasses the protocol.
allow_indirect_imports = true
