# The merge gates' thresholds for troupe (troupe-run/infrastructure spec: quality-gates). scripts/quality_gates.py,
# delivered from infrastructure, reads it strictly: an unknown key or a wrong type fails the check. It isn't delivered:
# these are troupe's own. Defaults approved by the owner on 2026-11-18 (openspec/changes/archive/2026-11-18-quality-gates/design.md).
version = 1

# Branch coverage, measured on CI's Linux, Python 3.15 leg only. A package can't measure below its baseline by more
# than the tolerance, and a package with no baseline must meet the floor. Raise a baseline by hand when the check says
# it could be raised. Baselines and tolerance from two runs of the leg on f9f6bd6a (CI run 44240981380, attempts 1 and
# 2): each baseline is the lower measurement rounded down to 0.1; runner-openai differed by 0.53 points between them,
# so the tolerance is 0.6 (openspec/changes/archive/2026-11-18-quality-gates/design.md, D8).
[coverage]
floor = 80.0
tolerance = 0.6

[coverage.packages.troupe]
paths = ["packages/troupe"]
baseline = 91.9

[coverage.packages.troupe-artifacts-local]
paths = ["packages/troupe-artifacts-local"]
baseline = 91.7

[coverage.packages.troupe-identity-local]
paths = ["packages/troupe-identity-local"]
baseline = 96.1

[coverage.packages.troupe-plugin-sdk]
paths = ["packages/troupe-plugin-sdk"]
baseline = 94.9

[coverage.packages.troupe-run]
paths = ["packages/troupe-run"]

[coverage.packages.troupe-stage-local]
paths = ["packages/troupe-stage-local"]
baseline = 100.0

[coverage.packages.troupe-store-text]
paths = ["packages/troupe-store-text"]
baseline = 93.0

[coverage.packages.troupe-vcs-files]
paths = ["packages/troupe-vcs-files"]
baseline = 95.2

[coverage.packages.troupe-vcs-git]
paths = ["packages/troupe-vcs-git"]
baseline = 93.3

[coverage.packages.runner-anthropic]
paths = ["plugins/runner-anthropic"]
baseline = 86.5

[coverage.packages.runner-claude-code]
paths = ["plugins/runner-claude-code"]
baseline = 72.7

[coverage.packages.runner-mistralrs]
paths = ["plugins/runner-mistralrs"]
baseline = 88.0

[coverage.packages.runner-ollama]
paths = ["plugins/runner-ollama"]
baseline = 89.6

[coverage.packages.runner-openai]
paths = ["plugins/runner-openai"]
baseline = 91.0

[coverage.packages.runner-scripted]
paths = ["plugins/runner-scripted"]
baseline = 81.7

[coverage.packages.scripts]
paths = ["scripts"]
baseline = 88.4

# Cyclomatic complexity (lizard) of each function a change adds or edits: above the limit, it may not be new or more
# complex than before. Tests and the generated config models are left out, and every gate leaves out the files
# infrastructure delivers, which .github/guard-delivery.json lists: they're measured at their source.
[complexity]
block_above = 25
languages = ["python"]
exclude = [
    "**/tests/**",
    "packages/troupe/src/troupe/core/config/models.py",
]

# The size in bytes of each file a change adds or changes (troupe-run/infrastructure#271): above block_above it may not
# be new or larger than before, unless [size.allow] gives it its own ceiling; above warn_above it's noted. A review reads
# every changed file whole, and one Read holds about 25,000 tokens. Limits set by the owner on 2026-11-19
# (openspec/changes/archive/2026-11-20-size-gate/design.md, D1). Fixtures, archived changes, the lock file and the
# changelogs release-please writes aren't reviewed as code, so they aren't measured; binary files never are. Each
# release makes a changelog larger, and the review skips release pull requests (#535, owner 2026-11-27).
[size]
block_above = 49152
warn_above = 32768
exclude = ["**/fixtures/**", "openspec/changes/archive/**", "uv.lock", "**/CHANGELOG.md"]

# The files over block_above on 2026-11-20, each capped at its size then, rounded up to a whole KiB, plus 16 KiB
# (design D2). Each has an issue to split it. Remove an entry once its file is under block_above: the check fails on an
# entry that's no longer needed.
[size.allow]
"protocol/schemas/error.schema.json" = 88064                     # troupe-run/troupe#471
"packages/troupe/src/troupe/protocol/error.schema.json" = 88064  # troupe-run/troupe#472
"contributing/runners.md" = 84992                                # troupe-run/troupe#473
"packages/troupe/tests/integration/test_run_host.py" = 83968     # troupe-run/troupe#474
"openspec/specs/runner-protocol/spec.md" = 71680                 # troupe-run/troupe#475
"openspec/specs/openai-runner/spec.md" = 68608                   # troupe-run/troupe#477

# A pull request that changes the lock file fails on an advisory of these severities that has a fix.
[audit]
lock_files = ["uv.lock"]
block = ["high", "critical"]
